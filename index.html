<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Chat Demo</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container-fluid">
      <div class="row">
        <!-- Sidebar -->
        <div class="col-md-3 sidebar">
          <h4>AI Chat Demo</h4>
          <button class="btn btn-dark w-100">New Chat</button>
          <div class="chat-list">
            <button class="chat-btn">Chat 1</button>
            <button class="chat-btn">Chat 2</button>
            <button class="chat-btn">Chat 3</button>
          </div>
          <div class="social-links">
            <a href="#"><i class="bi bi-facebook"></i></a>
            <a href="#"><i class="bi bi-linkedin"></i></a>
            <a href="#"><i class="bi bi-youtube"></i></a>
            <a href="#"><i class="bi bi-instagram"></i></a>
          </div>
        </div>

        <!-- Main Content -->
        <div class="col-md-9">
          <!-- Model Selector -->
          <div class="model-selector mb-3">
            <div class="d-flex justify-content-between align-items-center">
              <h4 class="m-0">AI Chat Demo</h4>
              <select class="form-select w-25">
                <option selected>Choose Open AI Model</option>
                <option value="1">Model 1</option>
                <option value="2">Model 2</option>
              </select>
            </div>
          </div>

          <div class="chat-area" id="chat-area">
            <div class="message user-message">Hello, can you help me?</div>
            <div class="message bot-message">
              Sure — what do you want to build today?
            </div>
          </div>

          <form class="input-group">
            <input
              id="prompt"
              name="prompt"
              type="text"
              class="form-control chat-input"
              placeholder="Ask Me"
              autocomplete="off"
            />
            <button type="submit" class="btn btn-dark">Search</button>
          </form>
        </div>
      </div>
    </div>

    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />
    <!-- Bootstrap JS and Popper.js -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js"></script>

    <script src="./script.js"></script>
  </body>
</html>
