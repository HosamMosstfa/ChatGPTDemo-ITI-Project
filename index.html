<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Chat Demo</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container-fluid">
      <div class="row">
        <div class="col-md-3 sidebar">
          <h4>AI Chat Demo</h4>
          <button class="btn btn-dark w-100" id="new-chat-btn">New Chat</button>

          <div class="chat-list">
            <button class="chat-btn active-chat" id="chat1">Chat 1</button>
            <button class="chat-btn" id="chat2">Chat 2</button>
            <button class="chat-btn" id="chat3">Chat 3</button>
          </div>

          <div class="social-links">
            <a href="#"><i class="bi bi-facebook"></i></a>
            <a href="#"><i class="bi bi-linkedin"></i></a>
            <a href="#"><i class="bi bi-youtube"></i></a>
            <a href="#"><i class="bi bi-instagram"></i></a>
          </div>
        </div>

        <div class="col-md-9">
          <div class="model-selector mb-3">
            <div class="d-flex justify-content-between align-items-center">
              <h4 class="m-0">AI Chat Demo</h4>
              <select class="form-select w-25" id="model-select">
                <option value="text" selected>Text Model (GPT)</option>
                <option value="image">Image Generator (Playground v2)</option>
              </select>
            </div>
          </div>

          <div class="chat-area" id="chat-area"></div>

          <form class="input-group">
            <input
              id="prompt"
              name="prompt"
              type="text"
              class="form-control chat-input"
              placeholder="Type your message or image description..."
              autocomplete="off"
            />
            <button type="submit" class="btn btn-dark">Send</button>
          </form>
        </div>
      </div>
    </div>

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script src="./script.js"></script>
  </body>
</html>
